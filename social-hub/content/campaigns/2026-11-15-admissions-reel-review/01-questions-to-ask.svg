<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d">
<title id="t">Questions to ask when considering school admissions</title><desc id="d">Ask about admissions steps, fee structure, and bus route coverage; confirm details with the school.</desc>
<rect width="1080" height="1080" fill="#ECFDF5"/><rect x="48" y="48" width="984" height="984" rx="36" fill="#FFFFFF"/><rect x="88" y="88" width="904" height="14" rx="7" fill="#16A34A"/>
<text x="100" y="160" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="1">SCHOOL ADMISSIONS</text>
<text x="100" y="262" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="700">Questions to ask</text>
<text x="100" y="324" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="28">Start with the details that matter to your family.</text>
<g><rect x="100" y="400" width="880" height="128" rx="22" fill="#F3F4F6"/><circle cx="164" cy="464" r="28" fill="#16A34A"/><text x="164" y="473" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">1</text><text x="218" y="474" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">Admission steps</text></g>
<g><rect x="100" y="558" width="880" height="128" rx="22" fill="#F3F4F6"/><circle cx="164" cy="622" r="28" fill="#16A34A"/><text x="164" y="631" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">2</text><text x="218" y="632" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">Fee structure</text></g>
<g><rect x="100" y="716" width="880" height="128" rx="22" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><circle cx="164" cy="780" r="28" fill="#059669"/><text x="164" y="789" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">3</text><text x="218" y="790" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">Bus route coverage</text></g>
<text x="100" y="912" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">Confirm current details directly with the school.</text><text x="100" y="974" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">Comment ADMISSION to request information</text>
</svg>
