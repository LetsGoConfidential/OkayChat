<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d">
<title id="t">Make your school enquiry clear</title><desc id="d">Mention the class you are enquiring about, the information you need, and the next step you want to understand.</desc>
<rect width="1080" height="1080" fill="#0F172A"/><rect x="54" y="54" width="972" height="972" rx="38" fill="#ECFDF5"/><rect x="92" y="92" width="896" height="12" rx="6" fill="#059669"/>
<text x="104" y="164" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="1">A CLEARER SCHOOL ENQUIRY</text>
<text x="104" y="258" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="49" font-weight="700">A clear question makes</text><text x="104" y="318" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="49" font-weight="700">the next step easier.</text>
<rect x="104" y="388" width="872" height="142" rx="24" fill="#FFFFFF"/><text x="140" y="440" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">01 · WHAT ARE YOU ASKING ABOUT?</text><text x="140" y="490" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">Name the class or admission stage.</text>
<rect x="104" y="558" width="872" height="142" rx="24" fill="#FFFFFF"/><text x="140" y="610" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">02 · WHAT INFORMATION DO YOU NEED?</text><text x="140" y="660" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">Fees, transport, or admission steps?</text>
<rect x="104" y="728" width="872" height="142" rx="24" fill="#FFFFFF"/><text x="140" y="780" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">03 · WHAT HAPPENS NEXT?</text><text x="140" y="830" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">Ask which step applies to your family.</text>
<text x="104" y="940" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Check dates and availability with the school.</text><text x="104" y="982" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Comment ADMISSION · OkayChat.in</text>
</svg>
