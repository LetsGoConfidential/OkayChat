<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="t d">
<title id="t">A quick checklist before asking about school admission</title><desc id="d">Prepare the class, fee questions, and your area for transport before contacting the school. Confirm details with the school.</desc>
<rect width="1080" height="1080" fill="#F3F4F6"/><rect x="60" y="60" width="960" height="960" rx="36" fill="#FFFFFF"/><path d="M96 96h888v180H96z" fill="#16A34A" rx="24"/>
<text x="112" y="154" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="1">BEFORE YOU ENQUIRE</text><text x="112" y="222" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="700">Keep these questions handy</text>
<g fill="#0F172A" font-family="Inter,Arial,sans-serif"><circle cx="148" cy="390" r="27" fill="#ECFDF5" stroke="#059669" stroke-width="3"/><path d="M136 390l8 8 17-19" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="202" y="400" font-size="31" font-weight="700">Which class are you asking about?</text>
<circle cx="148" cy="538" r="27" fill="#ECFDF5" stroke="#059669" stroke-width="3"/><path d="M136 538l8 8 17-19" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="202" y="548" font-size="31" font-weight="700">What fee details do you need?</text>
<circle cx="148" cy="686" r="27" fill="#ECFDF5" stroke="#059669" stroke-width="3"/><path d="M136 686l8 8 17-19" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="202" y="696" font-size="31" font-weight="700">Does transport reach your area?</text></g>
<rect x="112" y="782" width="856" height="112" rx="20" fill="#ECFDF5"/><text x="144" y="832" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">Confirm current dates, policies, and availability</text><text x="144" y="870" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">directly with the school.</text>
<text x="112" y="956" fill="#059669" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Comment ADMISSION to request details</text><text x="968" y="956" fill="#0F172A" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="end">OkayChat.in</text>
</svg>
