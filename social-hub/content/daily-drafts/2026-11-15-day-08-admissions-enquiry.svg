<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">An admission enquiry needs a next step</title>
  <desc id="desc">An illustrative three-step workflow: understand the question, assign an owner, and make the next step clear.</desc>
  <rect width="1080" height="1080" fill="#ECFDF5"/>
  <rect x="52" y="52" width="976" height="976" rx="36" fill="#FFFFFF"/>
  <rect x="88" y="88" width="904" height="12" rx="6" fill="#16A34A"/>
  <text x="100" y="158" fill="#059669" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="1.2">A CLEARER ENQUIRY WORKFLOW</text>
  <text x="100" y="240" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="700">An admission enquiry</text>
  <text x="100" y="300" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="700">needs a next step.</text>
  <text x="100" y="358" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="400">Start by understanding what the person is asking.</text>
  <g>
    <rect x="100" y="420" width="880" height="132" rx="20" fill="#F3F4F6"/>
    <circle cx="158" cy="486" r="30" fill="#16A34A"/>
    <text x="158" y="495" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">1</text>
    <text x="212" y="478" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Understand the question</text>
    <text x="212" y="518" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="21">Details, eligibility, schedule, or help choosing?</text>
  </g>
  <g>
    <rect x="100" y="574" width="880" height="132" rx="20" fill="#F3F4F6"/>
    <circle cx="158" cy="640" r="30" fill="#16A34A"/>
    <text x="158" y="649" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">2</text>
    <text x="212" y="632" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Assign an owner</text>
    <text x="212" y="672" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="21">Make it clear who will respond or follow up.</text>
  </g>
  <g>
    <rect x="100" y="728" width="880" height="132" rx="20" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <circle cx="158" cy="794" r="30" fill="#059669"/>
    <text x="158" y="803" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">3</text>
    <text x="212" y="786" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Make the next step clear</text>
    <text x="212" y="826" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="21">A helpful answer, a handoff, or a follow-up.</text>
  </g>
  <text x="100" y="930" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">What question should come first for your team?</text>
  <text x="100" y="976" fill="#059669" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">OkayChat.in</text>
  <text x="980" y="976" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="17" text-anchor="end">Illustrative workflow</text>
</svg>
